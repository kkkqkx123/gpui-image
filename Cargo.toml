[package]
name = "gpui-image"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Image decoding, processing and display components for GPUI applications"
repository = "https://github.com/kkkqkx123/gpui-image"
keywords = ["gpui", "image", "processing", "component", "desktop"]
categories = ["gui", "multimedia"]
readme = "README.md"
publish = true

# This crate is an independent repository, not a gpui-kit workspace member.
# It is mounted at `crates/gpui-image` via `.gitmodules`, following the same
# pattern as `crates/tray` and `crates/autostart`: the nested `[workspace]`
# below keeps Cargo from including it in the host workspace, so the host's
# root `Cargo.toml` / `Cargo.lock` stay byte-identical with upstream.
[workspace]
members = ["crates/*", "examples/*"]

[features]
default = ["gpui-kit", "component"]
# Image display through GPUI. Select exactly one flavor; `bridge` rejects
# any other combination with a `compile_error!`.
gpui-kit = ["dep:gpui-kit-backend"]
gpui-fast = ["dep:gpui-fast-backend", "gpui-component?/gpui-fast"]
# The generic `Image` / `ImageFallback` display components.
component = ["dep:gpui-component"]

[dependencies]
gpui-image-core = { path = "crates/image-core", version = "0.1" }
# Every flavor publishes the same `gpui` API under a different package name.
# The selected one must be the GPUI the application itself builds against,
# because the bridge hands GPUI types (`ImageSource`, `ObjectFit`) to it.
#
# The pins track the latest published GPUI Kit release (see the design doc);
# `script/check-gpui-kit-pin.py` fails CI when they drift.
gpui-kit-backend = { package = "gpui-pre", version = "=0.3.10", default-features = false, optional = true }
gpui-fast-backend = { package = "gpui-fast", version = "0.1.12", default-features = false, optional = true }
# Element naming and sizing follow the styled component library. The pin
# tracks the latest published gpui-component release, like the GPUI pins.
gpui-component = { version = "=0.8.1", default-features = false, optional = true }

[lints]
workspace = true

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

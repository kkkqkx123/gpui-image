[package]
name = "gpui-image-component"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Generic Image and ImageFallback display components for GPUI applications"
repository = "https://github.com/kkkqkx123/gpui-image"
keywords = ["gpui", "image", "component", "desktop"]
categories = ["gui", "multimedia"]
readme = "../../README.md"
publish = true

[features]
default = ["gpui-kit"]
# Select exactly one GPUI flavor; `lib.rs` rejects any other combination.
# `gpui-component` defaults to the same `gpui-pre` backend, so only the fast
# flavor needs forwarding.
gpui-kit = ["dep:gpui-kit-backend"]
gpui-fast = ["dep:gpui-fast-backend", "gpui-component/gpui-fast"]

[dependencies]
# Element naming and sizing follow the styled component library. The pin
# tracks the latest published gpui-component release, like the GPUI pins.
gpui-component = { version = "0.8", default-features = false }
# Every flavor publishes the same `gpui` API under a different package name.
# The selected one must be the GPUI the application itself builds against.
gpui-kit-backend = { package = "gpui-pre", version = "=0.3.9", default-features = false, optional = true }
gpui-fast-backend = { package = "gpui-fast", version = "0.1.10", default-features = false, optional = true }

[lints]
workspace = true

[package]
name = "image_demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "Demonstrates gpui-image decoding, processing and display"

[dependencies]
# The published GPUI Kit release supplies the application shell and the GPUI
# types. The image crates must be built against the same GPUI, so the flavor
# features below select one GPUI for both.
gpui-kit = { version = "0.8", default-features = false }
gpui-image = { path = "../..", default-features = false }

[features]
default = ["gpui-kit"]
# GPUI Kit's `gpui-pre` snapshot, the default backend. `component` supplies
# the `gpui_kit::component` items the demo imports.
gpui-kit = ["gpui-image/gpui-kit", "gpui-image/component", "gpui-kit/component"]
# GPUI Fast. It replaces the default backend, so it replaces the flavor
# feature too: build it with `--no-default-features --features gpui-fast`.
gpui-fast = [
    "gpui-image/gpui-fast",
    "gpui-image/component",
    "gpui-kit/gpui-fast",
    "gpui-kit/component",
]
